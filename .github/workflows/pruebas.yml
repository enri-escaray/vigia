# Corre las pruebas automáticas en cada push a main y en cada pull request.
#
# Las dependencias se instalan sin YOLO/PyTorch, que las pruebas no usan, y con
# OpenCV sin interfaz gráfica (Vigía no abre ventanas; en un servidor es lo que
# corresponde).
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(ultralytics|opencv-python)([<>=~ ]|$)' requirements.txt > requisitos-ci.txt
          python -m pip install -r requisitos-ci.txt opencv-python-headless "pytest>=8" "httpx>=0.27"

      - name: Correr las pruebas
        run: python -m pytest -q
